<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Footballer Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-weight: bold;
            font-size: 32px;
            margin-bottom: 20px;
        }
        .nav-link {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 2px solid #000;
            padding: 8px;
            text-align: left;
            font-size: 14px;
        }
        th {
            font-weight: bold;
        }
        img.footballer-img {
            width: 70px;
            height: 80px;
            object-fit: cover;
            display: block;
        }
    </style>
</head>
<body>

<a href="/chat" class="nav-link"> Ollama Sayfasına Git</a>

<h1>FOOTBALLERS</h1>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>NAME</th>
        <th>TEAM</th>
        <th>CITY</th>
        <th>SHIRT NUMBER</th>
        <th>MARKET VALUE</th>
        <th>PHOTO</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="footballer : ${footballers}">
        <td th:text="${footballer.footballerid}">1</td>
        <td th:text="${footballer.full_name}">Victor Osimhen</td>
        <td th:text="${footballer.teamname}">Galatasaray</td>
        <td th:text="${footballer.city}">Istanbul</td>
        <td th:text="${footballer.shirtnumber}">45</td>
        <td th:text="${footballer.marketvalue}">75000000</td>
        <td>
            <img class="footballer-img"
                 th:src="@{${hdfsWebUrl} + ${footballer.photo} + '?op=OPEN'}"
                 alt="Footballer Image"/>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
