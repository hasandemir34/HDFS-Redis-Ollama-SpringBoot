server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/football?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:football_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

hdfs.uri=hdfs://localhost:9000
hdfs.path=/football
hdfs.web.url=http://127.0.0.1:9870/webhdfs/v1/football/

ollama.api.url=http://localhost:11434/api/generate
